apiVersion: apps/v1
kind: Deployment
#이 파일 정의
metadata:
  name: payment-dpy-dev
#동작 정의
spec:
  replicas: 1
#  제어할 라벨
  selector:
    matchLabels:
      app: payment-dev
#      pod 정의
  template:
    metadata:
      annotations:
        # 이 Pod를 스크랩하도록 Prometheus에게 지시
        prometheus.io/scrape: "true"
        # 메트릭 경로 지정
        prometheus.io/path: "/actuator/prometheus"
        # 메트릭 포트 지정 (Service targetPort와 일치)
        prometheus.io/port: "8881"
      labels:
        app: payment-dev
#        컨테이너 정의
    spec:
      containers:
        - name: payment-pod-dev
          image: payment:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8087
          envFrom:
            - configMapRef:
                name: payment-config-dev
            - secretRef:
                name: secret-common-dev
      restartPolicy: Always
