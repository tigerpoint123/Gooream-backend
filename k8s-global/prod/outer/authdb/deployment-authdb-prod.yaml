apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-db-dpy-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-db-prod
  template:
    metadata:
      labels:
        app: auth-db-prod
    spec:
      containers:
        - name: auth-db-pod-prod
          image: mysql:8.2.0
          envFrom:
            - configMapRef:
                name: auth-db-config-prod
            - secretRef:
                name: secret-common-prod
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: auth-db-data
              mountPath: /var/lib/mysql
      volumes:
        - name: auth-db-data
          persistentVolumeClaim:
            claimName: authdb-data-pvc