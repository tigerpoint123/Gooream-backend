apiVersion: apps/v1
kind: Deployment
#이 파일 정의
metadata:
  name: auth-dpy-prod
#동작 정의
spec:
  replicas: 1
#  제어할 라벨
  selector:
    matchLabels:
      app: auth-prod
#      pod 정의
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8881"
      labels:
        app: auth-prod
#        컨테이너 정의
    spec:
      containers:
        - name: auth-pod-prod
          image: yuio7279/auth
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
          env:
            - name: JAVA_OPTS
              value: "-Xms400M -Xmx400M" # 힙 메모리를 400MB로 고정
          envFrom:
            - configMapRef:
                name: auth-config-prod
            - secretRef:
                name: secret-common-prod
            - secretRef:
                name: auth-login-secret-prod
      restartPolicy: Always
