apiVersion: apps/v1

kind: Deployment

metadata:
  name: kibana-dpy-prod

spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana-prod

  template:
    metadata:
      labels:
        app: kibana-prod

    spec:
      containers:
        - name: kibana-pod-prod
          image: docker.elastic.co/kibana/kibana:9.2.1
          ports:
            - containerPort: 5601
          resources:
            limits:
              cpu: "400m"
              memory: "800Mi"
            requests:
              cpu: "300m"
              memory: "500Mi"
          envFrom:
            - configMapRef:
                name: kibana-config-prod