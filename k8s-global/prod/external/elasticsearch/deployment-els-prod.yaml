apiVersion: apps/v1

kind: Deployment

metadata:
  name: els-dpy-prod

spec:
  replicas: 1

  selector:
    matchLabels:
      app: els-prod

  template:
    metadata:
      labels:
        app: els-prod

    spec:
      containers:
        - name: elasticsearch-1-pod-prod
          image: docker.elastic.co/elasticsearch/elasticsearch:9.2.1
          ports:
            - containerPort: 9200
          resources:
            limits:
              cpu: "500m"
              memory: "1Gi"
            requests:
              cpu: "300m"
              memory: "600Mi"
          envFrom:
            - configMapRef:
                name: els-config-prod
          command: ["bash", "-c"]
          args:
            - |
              bin/elasticsearch-plugin list | grep -q analysis-nori || bin/elasticsearch-plugin install analysis-nori --batch;
              /usr/local/bin/docker-entrypoint.sh
