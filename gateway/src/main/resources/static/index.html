<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gooream - 중고거래 플랫폼</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: white;
            text-decoration: none;
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
        }

        .nav-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .hero {
            text-align: center;
            margin-bottom: 60px;
        }

        .hero h1 {
            font-size: 64px;
            color: white;
            margin-bottom: 16px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 24px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 300;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .card h3 {
            font-size: 24px;
            color: #333;
            margin-bottom: 12px;
        }

        .card p {
            color: #666;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 42px;
            }

            .subtitle {
                font-size: 18px;
            }

            .card-grid {
                grid-template-columns: 1fr;
            }

            .nav-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="/" class="logo">Gooream</a>
        <div class="nav-buttons">
            <a href="/orders/create-form" class="nav-btn">주문 생성 하기</a>
            <a href="/orders/deposit/charge-form" class="nav-btn">예치금 충전</a>
        </div>
    </div>

    <div class="container">
        <div class="hero">
            <h1>Gooream</h1>
            <p class="subtitle">간편한 중고거래 플랫폼</p>
        </div>

        <div class="card-grid">
            <div class="card">
                <div class="card-icon">📦</div>
                <h3>주문 생성</h3>
                <p>원하는 상품을 주문 하세요</p>
                <a href="/orders/create-form" class="btn">등록하기</a>
            </div>

            <div class="card">
                <div class="card-icon">💰</div>
                <h3>예치금 충전</h3>
                <p>안전한 거래를 위해 예치금을 충전하세요</p>
                <a href="/orders/deposit/charge-form" class="btn">충전하기</a>
            </div>
        </div>
    </div>
</body>
</html>
