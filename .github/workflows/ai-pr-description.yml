name: "AI PR Description"

permissions:
  contents: write
  pull-requests: write

on:
  pull_request:
    types: [ opened, synchronize ]

jobs:
  generate-pr-description:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Issue number in PR body
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          TITLE="${{ github.event.pull_request.title }}"
          ISSUE_NUMBER=$(echo "$TITLE" | grep -oP '\[\K[0-9]+(?=\])' | head -1)
          PR_BODY=$(gh pr view $PR_NUMBER --json body -q '.body')
          
          UPDATED_BODY=$(echo "$PR_BODY" | sed "s/- 관련 이슈 번호:.*/- 관련 이슈 번호: #$ISSUE_NUMBER/")
          
          gh pr edit $PR_NUMBER --body "$UPDATED_BODY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get diff of the PR
        id: diff
        run: |
          DIFF=$(gh pr diff ${{ github.event.pull_request.number }})
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate PR Description using AI
        id: description
        shell: bash
        run: |
          DIFF=$(gh pr diff ${{ github.event.pull_request.number }} | jq -Rs .)
          echo "$DIFF" > diff.txt
          
          PR_PROMPT="
          변경 사항을 의미 단위별 주제로 분류하고 번호 매겨 작성하라. 각 번호(주요 주제) 아래 핵심 내용을 불릿으로 정리한 중첩 목록(nested list) 형태로 요약하라.
          
          출력 규칙:
          1) 주요 변경점을 최소 1개 최대 6개 이하의 주제로 자동 분류하고 각 주제를 번호 매긴 상위 목록으로 나타낼 것.
          2) 주제는 기능 단위·모듈 단위·개발 의도 단위로 자연스럽게 묶으며, 변경된 파일·코드 흐름·개선 목적을 중심으로 자동 분류할 것.
          3) 각 주제 아래 하위 bullet 목록을 사용해 핵심 변경점만 간결하게 정리하되, 변경 규모와 중요도에 비례해 bullet 수·설명 정도를 조절할 것.
          4) 전체 출력은 기본적으로 공백 포함 250~600자 내로 작성하되, diff의 변경 규모가 큰 경우 최대 800자까지 확장할 수 있다. 단, 필요 이상으로 장황하게 작성하지 말 것.
          5) 변경점이 존재한다면 최소 1개 이상의 주제를 반드시 생성하되, 변경점이 매우 적으면서, 동시에 중요도가 낮다고 판단되는 주제는 목록에서 제외할 것.
          6) 모든 주제는 중요도가 높은 순서대로 나열할 것.
          7) 필요한 경우 주제 수를 더 줄여도 된다.
          8) diff 에 등장한 파일명·클래스명·폴더명·함수명 등은 그대로 사용하며, 마음대로 번역하지 말 것.
          9) 변경 사항을 기반으로 확실한 내용만 서술하고 중복·불필요·추측성 문장은 금지.
          10) 이모티콘, 이모지, 특수문자 데코레이션 사용 금지.
          11) 실제로 변경되지 않은 내용을 이용해 주제 혹은 하위 bullet 내용을 작성하는 것은 금지.
          12) 라인 앞 글자가 + 면 추가된 코드, - 면 삭제된 코드.
          13) diff의 context 라인(공백으로 시작하는 라인)은 변경 사항이 아니므로 분석에서 제외한다.
          14) @@ ... @@ 메타데이터 라인은 코드 변경이 아니므로 분석에 포함하지 않는다.
          diff:
          "
          
          printf -v ESCAPED_PROMPT '%s' "$PR_PROMPT"
          
          jq -n \
          --arg prompt "$ESCAPED_PROMPT" \
          --rawfile diff diff.txt \
          '{
            model: "gpt-5.1",
            messages: [
              { role: "system", content: "너는 GitHub PR 요약 전문가야." },
              { role: "user",   content: $prompt },
              { role: "user",   content: $diff }
            ]
          }' > payload.json
          
          RESPONSE=$(curl https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d @payload.json)
          
          echo "DISPLAY RESPONSE"
          echo "$RESPONSE"
          CONTENT=$(echo $RESPONSE | jq -r ".choices[0].message.content")
          
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Update PR Description body
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          
          PR_BODY=$(gh pr view $PR_NUMBER --json body -q '.body')
          
          CLEAN_BODY=$(printf "%s" "$PR_BODY" | sed -E ':a;N;$!ba;s/<!-- AI-GENERATOR:START -->.*<!-- AI-GENERATOR:END -->//g')
          
          echo "$CLEAN_BODY" > pr_body.txt
          
          cat << 'EOF' > ai_summary.txt
          ${{ steps.description.outputs.content }}
          EOF
          
          {
            cat pr_body.txt
            echo "<!-- AI-GENERATOR:START -->"
            echo "⚙️ AI 생성 요약"
            echo "---"
            cat ai_summary.txt
            echo "<!-- AI-GENERATOR:END -->"
          } > updated_body.txt
          
          # 4) 출력 확인
          echo "==== UPDATED_BODY BEGIN ===="
          cat updated_body.txt
          echo "==== UPDATED_BODY END ===="
          
          # 5) PR 내용 업데이트
          gh pr edit $PR_NUMBER --body "$(cat updated_body.txt)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTENT: ${{ steps.description.outputs.content }}

      - name: Generate PR Review using AI
        id: review
        shell: bash
        run: |
          DIFF=$(gh pr diff ${{ github.event.pull_request.number }} | jq -Rs .)
          echo "$DIFF" > diff.txt
          
          PR_PROMPT="
          출력 규칙:
            1) 실제 문제를 유발하는 치명적 항목만 추출할 것.
            2) 주요 문제는 최대 3개 이하의 주제로만 분류하고 번호 매겨 제시한다. 3개를 초과하는 경우, 심각도와 실제 발생 가능성을 기준으로 상위 3개만 선택한다.
            3) 모든 주제는 심각도 기준(서비스 중단, 데이터 무결성 훼손, 보안 위험, 중대한 논리 오류 등) 내림차순 정렬.
            4) 각 주제 아래 핵심 내용을 아래와 같은 출력 형태로, 원인·결과·위험성을 간결하게 기술. 단 3~6줄 이내로 요약한다.
              출력 형식:
                1. [문제 주제]
                  - [ ] 해결할 필요 있는 문제인지 여부: (예/아니오)
                  - 원인:
                  - 결과:
                  - 위험성:
            4-1) 단, '- [ ] 해결할 필요 있는 문제인지 여부: (예/아니오)' 는 사용자가 직접 판단하고 체크하므로, 원본 그대로 출력할 것.
            5) 추측성 내용 금지. diff에 명확히 나타난 위험만 기술할 것.
            6) 에러가 있다면, 그 원인이 되는 코드를 '파일명: 코드블록' 형식으로 정확히 기재할 것.
            7) diff 외 코드 문맥이 보이지 않는 경우 추측을 금지하고 '판단 불가'로 간주할 것.
              - '판단 불가'의 경우 구역을 나눠 '잠정적 문제 가능성'으로 명시하고, 그 아래에 내용을 작성할 것.
              - 단, diff 내부 변경만으로 즉시 오류가 보장되는 경우(예: 컴파일 불가, 변수 누락, 타입 불일치), 문맥이 부족해도 치명적 문제로 인정한다.
            8) diff 에 등장한 파일명·클래스명·폴더명·함수명 등은 그대로 사용하며, 마음대로 번역하지 말 것.
            9) '+'는 추가된 코드, '-'는 삭제된 코드로 간주하고 실제 변경 내용만 분석.
            10) 이모티콘, 이모지, 특수문자 데코레이션 사용 금지.
            11) diff의 context 라인(공백으로 시작하는 라인)은 변경 사항이 아니므로 분석에서 제외한다.
            12) @@ ... @@ 메타데이터 라인은 코드 변경이 아니므로 분석에 포함하지 않는다.
    
          diff:
          "
          
          printf -v ESCAPED_PROMPT '%s' "$PR_PROMPT"
          
          jq -n \
          --arg prompt "$ESCAPED_PROMPT" \
          --rawfile diff diff.txt \
          '{
            model: "gpt-5.1",
            messages: [
              { role: "system", content: "너는 GitHub 코드 리뷰 전문가야." },
              { role: "user",   content: $prompt },
              { role: "user",   content: $diff }
            ]
          }' > payload.json
          
          RESPONSE=$(curl https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d @payload.json)
          
          echo "DISPLAY RESPONSE"
          echo "$RESPONSE"
          CONTENT=$(echo $RESPONSE | jq -r ".choices[0].message.content")
          
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Update PR Review body
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          
          PR_BODY=$(gh pr view $PR_NUMBER --json body -q '.body')
          
          CLEAN_BODY=$(printf "%s" "$PR_BODY" | sed -E ':a;N;$!ba;s/<!-- AI-REVIEW:START -->.*<!-- AI-REVIEW:END -->//g')
          
          echo "$CLEAN_BODY" > pr_body.txt
          
          cat << 'EOF' > ai_review.txt
          ${{ steps.review.outputs.content }}
          EOF
          
          {
            cat pr_body.txt
            echo "<!-- AI-REVIEW:START -->"
            echo "🛠️ AI 코드 리뷰"
            echo "---"
            cat ai_review.txt
            echo "<!-- AI-REVIEW:END -->"
          } > updated_body.txt
          
          # 4) 출력 확인
          echo "==== UPDATED_BODY BEGIN ===="
          cat updated_body.txt
          echo "==== UPDATED_BODY END ===="
          
          # 5) PR 내용 업데이트
          gh pr edit $PR_NUMBER --body "$(cat updated_body.txt)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTENT: ${{ steps.review.outputs.content }}