<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예치금 충전 - Gooream</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 500px;
        }

        h2 {
            color: #1a202c;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            color: #718096;
            font-size: 14px;
            text-align: center;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            color: #2d3748;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s;
            background: #f7fafc;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input::placeholder {
            color: #a0aec0;
        }

        small.error {
            display: block;
            color: #e53e3e;
            font-size: 12px;
            margin-top: 6px;
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        button[type="submit"]:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        @media (max-width: 640px) {
            .container {
                padding: 30px 20px;
            }

            h2 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>예치금 충전</h2>
        <p class="subtitle">Gooream 예치금을 충전하세요</p>
        
        <form id="depositChargeForm">
            <div class="form-group">
                <label for="userCode">사용자 코드 (User Code) *</label>
                <input type="text" id="userCode" name="userCode" required value="USER-001" placeholder="예: USER-001">
                <small class="error">이 값은 X-User-Code 헤더로 서버에 전달됩니다.</small>
            </div>
            
            <div class="form-group">
                <label for="amount">충전 금액 *</label>
                <input type="number" id="amount" name="amount" min="1" required value="50000" placeholder="충전할 금액을 입력하세요">
            </div>

            <button type="submit" id="submitBtn">충전하기</button>
        </form>
    </div>

    <script>
        // 폼 제출 처리
        document.getElementById('depositChargeForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '처리 중...';
            
            try {
                const userCode = document.getElementById('userCode').value;
                const amount = parseInt(document.getElementById('amount').value);
                
                if (!userCode || userCode.trim() === '') {
                    alert('사용자 코드를 입력해주세요.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '충전하기';
                    return;
                }
                
                if (!amount || amount <= 0) {
                    alert('충전 금액을 입력해주세요.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '충전하기';
                    return;
                }
                
                const formData = {
                    amount: amount
                };
                
                const response = await fetch('/api/orders/deposit/charge', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-User-Code': userCode
                    },
                    body: JSON.stringify(formData)
                });
                
                if (response.redirected) {
                    // 리다이렉트가 발생한 경우 (토스 결제)
                    window.location.href = response.url;
                } else if (response.ok) {
                    const result = await response.json();
                    alert('예치금 충전이 시작되었습니다!');
                    console.log('예치금 충전 시작:', result);
                } else {
                    const error = await response.json();
                    alert('예치금 충전 실패: ' + (error.message || '알 수 없는 오류'));
                }
            } catch (error) {
                console.error('예치금 충전 실패:', error);
                alert('예치금 충전 중 오류가 발생했습니다: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '충전하기';
            }
        });
    </script>
</body>
</html>
